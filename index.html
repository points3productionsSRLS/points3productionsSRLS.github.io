/* calcolo fiscale preventivo */
function calc(r){const imp=+r.imp||0,reg=r.reg||'Ordinario',ali=(parseFloat(String(r.iva||'').replace(/[^0-9.]/g,''))||0)/100;
const riv=r.inps=='Sì'?imp*.04:0,base=imp+riv,conIva=reg=='Ordinario'||reg=='Split payment (PA)';
const iva=conIva?base*ali:0;
const bollo=['Esente art. 10','Forfettario (no IVA)','Fuori campo art. 7-ter extra-UE'].includes(reg)&&base>77.47?2:0;
const rit=r.rit=='20%'?base*.2:0,totDoc=base+iva+bollo,split=reg=='Split payment (PA)'?iva:0,netto=totDoc-rit-split;
const k=conIva?'IVA '+Math.round(ali*100)+'%':reg;
return{imp,riv,base,iva,bollo,rit,totDoc,split,netto,k,ali,reg}}

function form(k,title){const s=S[k],E=ed&&ed.k==k?find(k,ed.id):null;let def={};if(!E&&k=='events'&&selDay)def.data=selDay;if(!E&&k=='clienti'){if(cF.v=='eff')def.stato='Cliente';if(cF.t)def.terr=cF.t;if(cF.n)def.natura=cF.n}window._attChi=E?E.chi:'';

if(t=='link'){if(!v)return'';const u=String(v),ok=/^(https?:\/\/|\/_blob\/)/.test(u);return ok?`<a href="${esc(u)}" target="_blank" rel="noopener"${u.startsWith('/_blob/')?' download':''}>${u.startsWith('/_blob/')?'Scarica ⤓':'Apri ↗'}</a>`:esc(u)}
if(t=='date')return fd(v);if(t=='person'||f=='nome'&&k=='team')return pill(v);if(t=='eur')return v===''||v==null?'':eur(v);

function warn(){const out=[],t=today(),in7=iso(new Date(Date.now()+7*864e5));
const ev=F('events'),toM=s=>{const m=String(s||'').match(/(\d+):(\d+)/);return m?+m[1]*60+ +m[2]:null};
const by={};ev.forEach(e=>{if(!e.data||!e.chi)return;const k=nk(e.chi)+e.data;(by[k]=by[k]||[]).push(e)});
Object.values(by).forEach(a=>{for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const x=a[i],y=a[j],s1=toM(x.ora),s2=toM(y.ora);if(s1==null||s2==null)continue;const e1=toM(x.fine)??s1+60,e2=toM(y.fine)??s2+60;
if(s1<e2&&s2<e1)out.push(`<div class="al">⚠ Sovrapposizione per ${pill(x.chi)} il ${fd(x.data)}: «${esc(x.titolo)}» (${esc(x.ora)}) e «${esc(y.titolo)}» (${esc(y.ora)})</div>`);
else if(x.luogo&&y.luogo&&nk(x.luogo)!=nk(y.luogo)&&!/online|zoom|meet|call|tel/i.test(x.luogo+y.luogo)&&Math.abs(s1-s2)<120)out.push(`<div class="al y">🚗 Verifica spostamento per ${pill(x.chi)} il ${fd(x.data)}: ${esc(x.luogo)} → ${esc(y.luogo)} in meno di 2 ore.</div>`)}});
ev.filter(e=>e.tipo=='Scadenza'&&e.data>=t&&e.data<=in7).forEach(e=>out.push(`<div class="al y">⏰ Scadenza ${fd(e.data)}: ${esc(e.titolo)}</div>`));

return out.length?`<div class="card"><h3>Avvisi</h3>${out.join('')}</div>`:''}

function vList(){

 let body='';
 if(cat=='cond'){body=`<div class="x-cat"><span class="n">§</span><div><div class="t">${$t('Condizioni generali','General terms')}</div><div class="s">${$t('Come leggere questo listino','How to read these rates')}</div></div></div><ul class="x-cond">${COND.map(c=>`<li>${E(tr(c))}</li>`).join('')}</ul><div class="x-note"><b style="color:#fff">${$t('Nota importante.','Important.')}</b> ${$t('Le tariffe di questo listino hanno valore orientativo. Per eventuali offerte specifiche si rimanda a un preventivo dedicato, costruito sulle esigenze di ogni progetto.','These rates are indicative. Specific offers are made through a dedicated quote, built around the needs of each project.')}</div>`}
 else{CATS.filter(c=>cat=='all'||cat==c.id).forEach(c=>{
  const gs=c.G.map(([g,its])=>[g,its.filter(([n,d])=>!ql||(n+' '+d+' '+g+' '+c.t+' '+tr(n)+' '+tr(d)+' '+tr(g)).toLowerCase().includes(ql))]).filter(x=>x[1].length);
  if(!gs.length)return;
  body+=`<div class="x-cat" id="c-${c.id}"><span class="n">${c.n}</span><div><div class="t">${E(c.t)}</div><div class="s">${E(tr(c.s))} · ${E(tr(c.d))}</div></div></div>`;
  gs.forEach(([g,its])=>{body+=`<div class="x-grp">${E(tr(g))}</div><div class="x-items">${its.map(([n])=>itemRow(ITEMS[c.id+'|'+n])).join('')}</div>`});
  if(c.crew)body+=`<div class="x-note"><b style="color:#fff">${$t('Note crew.','Crew notes.')}</b> ${E(tr(CREW_NOTE))}</div>`});
  if(!body)body=`<div class="x-empty">${$t('Nessun risultato per','No results for')} «${E(q)}».</div>`}
 return `<div class="x-wrap"><div class="x-hd"><div class="x-eye">${$t('Listino prezzi 2026','2026 rate card')}</div><h2 class="x-h2">${$t('Attrezzatura & crew','Equipment & crew')}</h2><p class="x-mu" style="margin:0">${$t('Prezzi giornalieri · IVA esclusa · tocca','Daily prices · VAT excluded · tap')} <b style="color:#fff">+</b> ${$t('per aggiungere al preventivo','to add to your quote')}</p></div>
 <div class="x-search">${IC.search}<input id="x-q" type="search" placeholder="${$t('Cerca: FX6, drone, gaffer, DOP…','Search: FX6, drone, gaffer, DOP…')}" value="${E(q)}" oninput="x3q(this.value)"></div>${chips}<div id="x-lb">${body}</div><div style="height:90px"></div></div>`}
function itemRow(it){const l=cart[it.k];return `<div class="x-it ${l?'sel':''}"><div class="nm"><b>${E(tr(it.n))}</b><span>${E(tr(it.d))}</span></div><div class="x-pr"><b>${priceL(it)}</b><span>${unitL(it.u)}</span></div>${it.u=='i'?'':`<button class="x-add" aria-label="${$t('Aggiungi','Add')}" onclick="x3add('${E(it.k).replace(/'/g,"\\'")}')">${l?'✓':'+'}</button>`}</div>`}
window.x3cat=c=>{cat=c;drawView();const el=document.querySelector('.x-chips');if(el)el.scrollIntoView({block:'nearest'})};
let qt;window.x3q=v=>{q=v;clearTimeout(qt);qt=setTimeout(()=>{const lb=$('#x-lb');const tmp=document.createElement('div');tmp.innerHTML=vList();lb.innerHTML=tmp.querySelector('#x-lb').innerHTML},120)};
